version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
  - package-ecosystem: "pip"
    directory: "/ai-portfolio-intelligence/apps/api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
  - package-ecosystem: "npm"
    directory: "/ai-portfolio-intelligence"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
