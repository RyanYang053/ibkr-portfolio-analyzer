name: Public fixture demo
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r ai-portfolio-intelligence/apps/api/requirements.txt
      - name: Generate synthetic preview
        run: |
          mkdir -p public-preview
          python scripts/demo.py --output public-preview/portfolio-demo.html
      - name: Upload HTML preview
        uses: actions/upload-artifact@v4
        with:
          name: public-fixture-preview
          path: public-preview/portfolio-demo.html
          if-no-files-found: error
          retention-days: 30
