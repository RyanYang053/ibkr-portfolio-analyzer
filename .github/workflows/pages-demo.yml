name: Publish synthetic demo to GitHub Pages
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fixture-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r ai-portfolio-intelligence/apps/api/requirements.txt
      - name: Build fixture-only static site
        run: |
          mkdir -p _site
          python scripts/demo.py --output _site/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
